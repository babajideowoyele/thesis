# @package _global_
# Model configuration for FOULVideoModel with TAdaFormer
# Stability: HIGH - architecture rarely changes

MODEL:
  NAME: FOULVideoModel

VIDEO:
  BACKBONE:
    META_ARCH: FOULVisionTransformer
    INPUT_RES: 224
    PATCH_SIZE: 14
    TUBLET_SIZE: 3
    TUBLET_STRIDE: 2
    NUM_FEATURES: 1024
    NUM_OUT_FEATURES: 1024
    DEPTH: 24
    NUM_HEADS: 16
    DROP_PATH: 0.2
    ATTN_DROPOUT: 0.1
    FF_DROPOUT: 0.1
    REQUIRE_PROJ: false
    ATTN_MASK_ENABLE: false
    DOUBLE_TADA: false
    FREEZE: true
    REDUCTION: 2
    BRANCH:
      NAME: TAdaFormerBlock
      ROUTE_FUNC_K: [3, 3]
      ROUTE_FUNC_R: 2
    TEMP_ENHANCE: false
  HEAD:
    NAME: FOULHead
    OUTPUT_DIM: 512
    NUM_CLASSES:
      TYPE: 9
      SEVERITY: 4
    DROPOUT_RATE: 0.2

PRETRAIN:
  ENABLE: false

# Soccer-specific data settings
DATA:
  DATA_ROOT_DIR: /sc/home/konrad.goldenbaum/data/SoccerData/mvfouls
  ANNO_DIR: null
  NUM_INPUT_CHANNELS: 1
  SAMPLING_MODE: segment_based
  SAMPLING_RATE: 4
  TRAIN_JITTER_SCALES: [0.08, 1.0]
  TRAIN_CROP_SIZE: 224
  TEST_SCALE: 224
  TEST_CROP_SIZE: 224
  MEAN: [0.48145466, 0.4578275, 0.40821073]
  STD: [0.26862954, 0.26130258, 0.27577711]
  MULTI_LABEL: false
  ENSEMBLE_METHOD: sum
  FPS: 25
  TARGET_FPS: 25
  CENTER_FRAME: 75
  CLASS_WEIGHTS:
    TYPE: 2.0
    SEVERITY: 1.0
  FREQUENCIES:
    TYPE: [361, 448, 1264, 178, 88, 383, 28, 103, 63]
    SEVERITY: [424, 1402, 403, 687]

# Soccer-specific augmentation
AUGMENTATION:
  COLOR_AUG: true
  COLOR_P: 0.0
  BRIGHTNESS: 0.5
  CONTRAST: 0.5
  SATURATION: 0.5
  HUE: 0.25
  GRAYSCALE: 0.3
  CONSISTENT: true
  SHUFFLE: true
  GRAY_FIRST: false
  RATIO: [0.857142857142857, 1.1666666666666667]
  USE_GPU: true

# Soccer-specific optimizer defaults
OPTIMIZER:
  ADJUST_LR: true
  LR_POLICY: cosine_v2
  COSINE_AFTER_WARMUP: true
  HEAD_LRMULT: 2.0
  NEW_PARAMS: ["tada"]
  NEW_PARAMS_MULT: 2.0

# Logging settings
OUTPUT_CFG_FILE: configuration.log
LOG_PERIOD: 4
DIST_BACKEND: nccl
LOG_MODEL_INFO: true
LOG_CONFIG_INFO: true
