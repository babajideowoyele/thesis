# @package _global_
# Experiment: Continue training attention backbone
# Stability: LOW - changes frequently per experiment

NUM_GPUS: 2

DATA:
  NUM_INPUT_FRAMES: 16
  TAKE_NUM_FRAMES: 64
  NUM_VIEWS: 2
  WEIGHTED_LOSS: false
  OVERFIT:
    ENABLE: false
    NUM_SAMPLES: 3

DATA_LOADER:
  NUM_WORKERS: 16
  PIN_MEMORY: false
  ENABLE_MULTI_THREAD_DECODE: true

AUGMENTATION:
  IS_SPLIT: false
  SSV2_FLIP: true
  RATIO: [0.75, 1.333]
  MIXUP:
    ENABLE: false
  CUTMIX:
    ENABLE: false
  RANDOM_ERASING:
    ENABLE: false
  LABEL_SMOOTHING: 0.1
  AUTOAUGMENT:
    ENABLE: true
    BEFORE_CROP: true
    TYPE: rand-m9-n4-mstd0.5-inc1

TRAIN:
  ENABLE: true
  DATASET: MVFoul
  BATCH_SIZE: 3
  ACCUMULATE_EVERY: 16
  MAX_BAD_EXAMPLES: 20
  BAD_EXAMPLE_THRESHOLD: 5
  LOG_FILE: training_log.log
  LOSS_FUNC: cross_entropy
  EVAL_PERIOD: 4
  NUM_FOLDS: 1
  AUTO_RESUME: true
  CHECKPOINT_PERIOD: 2
  CHECKPOINT_FILE_PATH: "/sc/home/konrad.goldenbaum/l14_clip_k710.pyth"
  CHECKPOINT_TYPE: pytorch
  CHECKPOINT_INFLATE: false
  FINE_TUNE: true
  ONLY_LINEAR: false

TEST:
  ENABLE: true
  DATASET: Mvfoul
  BATCH_SIZE: 16
  NUM_SPATIAL_CROPS: 1
  SPATIAL_CROPS: cc
  NUM_ENSEMBLE_VIEWS: 1
  LOG_FILE: val.log
  CHECKPOINT_FILE_PATH: "/sc/home/konrad.goldenbaum/l14_clip_k710.pyth"
  CHECKPOINT_TYPE: pytorch
  AUTOMATIC_MULTI_SCALE_TEST: true

WANDB:
  SYNC_ENABLE: true
  ENTITY_NAME: "konradgoldenbaum-hasso-plattner-institut"
  PROJECT_NAME: "Thesis-Goldenbaum"
  LOG_FREQUENCY: 200
