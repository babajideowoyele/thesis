_BASE_RUN: ../../../pool/run/training/soccer/finetune_soccer.yaml
_BASE_MODEL: ../../../pool/backbone/soccer/general_soccer.yaml


DATA:
  NUM_INPUT_FRAMES: 16
  TAKE_NUM_FRAMES: 16


OPTIMIZER:
  BASE_LR: 2e-4
  ADJUST_LR: true
  COSINE_END_LR: 2e-6
  COSINE_AFTER_WARMUP: true
  MAX_EPOCH: 24
  WARMUP_EPOCHS: 2
  WARMUP_START_LR: 1e-5

AUGMENTATION: 
  MIXUP: 
    ENABLE: false
  CUTMIX: 
    ENABLE: false
  RANDOM_ERASING:
    ENABLE: false
  LABEL_SMOOTHING: 0.1
  AUTOAUGMENT:
    ENABLE: true
    BEFORE_CROP: true
    TYPE: rand-m9-n4-mstd0.5-inc1
NUM_GPUS: 1
DATA_LOADER:
  NUM_WORKERS: 2
  PIN_MEMORY: false

TRAIN:
  ENABLE: true
  DATASET: MVFoul                    # !!@1
  BATCH_SIZE: 4
  LOG_FILE: training_log.log
  LOSS_FUNC: cross_entropy
  EVAL_PERIOD: 4
  NUM_FOLDS: 1
  AUTO_RESUME: true
  CHECKPOINT_PERIOD: 2
  CHECKPOINT_FILE_PATH: "/sc/home/konrad.goldenbaum/thesis/replicate_MVF/ckpts/checkpoints_backbone_no_temp/checkpoint_epoch_00004.pyth"    # !!@2
  CHECKPOINT_TYPE: pytorch
  CHECKPOINT_INFLATE: false
  FINE_TUNE: true
  ONLY_LINEAR: false

TEST:
  ENABLE: true                     # !!@3
  DATASET: Mvfoul                         # !!@3
  BATCH_SIZE: 8
  NUM_SPATIAL_CROPS: 1
  SPATIAL_CROPS: cc
  NUM_ENSEMBLE_VIEWS: 1
  LOG_FILE: val.log
  CHECKPOINT_FILE_PATH: "/sc/home/konrad.goldenbaum/l14_clip_k710.pyth"
  CHECKPOINT_TYPE: pytorch
  AUTOMATIC_MULTI_SCALE_TEST: true

WANDB:
  SYNC_ENABLE: true
  ENTITY_NAME: "konradgoldenbaum-hasso-plattner-institut"
  PROJECT_NAME: "Thesis-Goldenbaum"