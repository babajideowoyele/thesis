# MVFoul end-to-end training configuration
# Usage: python app/train_mvfouldl.py run

defaults:
  - loss: default
  - model: vjepa_soccer
  - _self_

# Prevent Hydra from changing cwd per-process (breaks torchrun + NCCL)
hydra:
  job:
    chdir: false

# ── General ──────────────────────────────────────────────────────────────────
seed: 42
backend: nccl  # nccl for GPU, gloo for CPU
output_path: ./outputs/mvfoul_scratch
validate_every: 1  # Run validation every N epochs
num_workers: 14

# ── Dataset (MVFoul) ────────────────────────────────────────────────────────
dataset:
  name: multiviewdataset  # Registry key

data:
  path: /sc/home/konrad.goldenbaum/data/SoccerData/mvfouls
  fps: 8
  num_views: 5
  start_frame: 0
  end_frame: 125
  step_size: 3


# ── Model ────────────────────────────────────────────────────────────────────


# ── Training ─────────────────────────────────────────────────────────────────
training:
  with_amp: true
  checkpoint_every: 500
  log_every_iters: 20
  resume_from: null
  hyper_params:
    num_epochs: 30
    learning_rate: 1e-4  # Reduced from 1e-2 (was too high for fine-tuning)
    weight_decay: 0.05
    num_iters_per_epoch: 1000
    num_warmup_epochs: 3
    momentum: 0.9
    train:
      batch_size: 2
      compound_size: 4 # set to >1 to use gradient accumulation (effective batch size = batch_size * compound_size)
    val:
      batch_size: 1

  loss:
    # for focal:
    gamma: 2.0
    alpha: 0.25
    reduction: sum # mean, sum
    beta: 0.9999
    

  # Loss per head
  severity:
    loss_fn:
      name: focal # cross_entropy two_way_multilabel focal
      label_smoothing: 0.1
  action:
    loss_fn:
      name: focal # cross_entropy two_way_multilabel focal
      label_smoothing: 0.1
      
      


# ── ClearML (disabled – replaced by W&B) ────────────────────────────────────
clearml:
  enable: false

# ── Metrics (evaluation & checkpointing) ────────────────────────────────────
metrics:
  primary: Loss   # which metric drives best-model checkpointing
  eval:
    SeverityBalancedAccuracy:
      type: balanced_accuracy
      task: severity
      num_classes: 4
    SeverityAccuracy:
      type: accuracy
      task: severity
    ActionAccuracy:
      type: accuracy
      task: action
    ActionBalancedAccuracy:
      type: balanced_accuracy
      task: action
      num_classes: 8
    SeverityConfusionMatrix:
      type: confusion_matrix
      task: severity
      num_classes: 4
    ActionConfusionMatrix:
      type: confusion_matrix
      task: action
      num_classes: 8
    Loss:
      type: loss
      task: combined



# ── Weights & Biases 
wandb:
  enable: true
  project: "Thesis-Goldenbaum"
  entity: "konradgoldenbaum-hasso-plattner-institut"
  run_name: mvfoul_scratch_run
  log_frequency: 50  # log every N iterations


# Debug
limit_batches: null
