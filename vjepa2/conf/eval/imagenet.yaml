# ImageNet evaluation configuration
eval_name: image_classification_frozen
folder: /tmp/vjepa_evals/imagenet
tag: imagenet-eval

model_kwargs:
  checkpoint: null
  pretrain_kwargs:
    encoder:
      model_name: vit_large

experiment:
  classifier:
    num_heads: 16
    num_probe_blocks: 4
  data:
    dataset_name: ImageNet
    num_classes: 1000
    root_path: /datasets/
    image_folder: ImageNet_FullSize/
    resolution: 256
  optimization:
    batch_size: 16
    multihead_kwargs:
      - lr: 0.001
        start_lr: 0.001
        final_lr: 0.0
        weight_decay: 0.001
        final_weight_decay: 0.0
        warmup: 0.0

val_only: false
use_fsdp: false
